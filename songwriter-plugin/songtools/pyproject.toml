[project]
name = "songtools"
version = "0.1.0"
description = "Offline songwriting toolkit CLI"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mido==1.3.3",
    "pychord==1.4.3",
    "reportlab==5.1.0",
]

[project.scripts]
songtools = "songtools.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "music21==10.5.2",
    "pytest==9.2.0",
    "wordfreq==3.1.1",
]
