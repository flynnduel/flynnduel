<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16131f">
  <title>Imposter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button class="logo" id="logo" type="button" aria-label="Imposter">IMPOSTER</button>
    <span class="who" id="who"></span>
    <button class="help" id="help" type="button" aria-label="Rules">?</button>
  </header>

  <main id="app" aria-live="polite"></main>

  <div class="rules" id="rules" hidden role="dialog" aria-modal="true" aria-labelledby="rules-title">
    <div class="rules-card">
      <div class="rules-head">
        <h2 id="rules-title">How to play</h2>
        <button class="close" id="rules-close" type="button" aria-label="Close rules">✕</button>
      </div>
      <div id="rules-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
